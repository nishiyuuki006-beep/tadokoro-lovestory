<title>屋上、焼いてかない？</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 18px; background: radial-gradient(circle at top, #35445c, #111827 65%);
    color: #fff; font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }
  .game { width: min(900px, 100%); border: 1px solid #ffffff35; border-radius: 20px;
    overflow: hidden; background: #101827; box-shadow: 0 18px 60px #0008; }
  header { padding: 18px 22px; background: #172235; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1 { margin:0; font-size: clamp(1.1rem, 3vw, 1.7rem); letter-spacing:.04em; }
  .badge { font-size:.78rem; color:#cbd5e1; border:1px solid #64748b; padding:5px 9px; border-radius:999px; white-space:nowrap; }
  .scene { min-height: 300px; display:grid; place-items:center; padding:18px; background:linear-gradient(135deg,#34465a,#182234); }
  .portrait { display:none; max-width:100%; height: min(44vh, 430px); object-fit:contain; border-radius:12px; box-shadow:0 8px 24px #0007; }
  .portrait.active { display:block; }
  .story { padding: 20px; }
  .speaker { font-weight:800; color:#93c5fd; margin-bottom:8px; font-size:1.05rem; }
  .dialogue { min-height:70px; font-size:clamp(1rem, 2.5vw, 1.2rem); line-height:1.8; white-space:pre-wrap; }
  .choices { display:flex; flex-wrap:wrap; gap:12px; margin-top:18px; }
  button { cursor:pointer; border:0; border-radius:12px; padding:13px 20px; font-weight:800; font-size:1rem; color:#111827; background:#f8fafc; transition:transform .12s, filter .12s; }
  button:hover { transform:translateY(-2px); filter:brightness(.94); }
  button:focus-visible { outline:3px solid #93c5fd; outline-offset:3px; }
  .primary { background:#86efac; }
  .danger { background:#fca5a5; }
  .hidden { display:none !important; }
  .foot { padding:0 20px 18px; color:#94a3b8; font-size:.82rem; }
  @media (max-width:520px) { header { align-items:flex-start; flex-direction:column; } .scene { min-height:240px; } .portrait { height: min(38vh, 340px); } .story { padding:16px; } }
</style>

<script>
const $ = id => document.getElementById(id);
function showPortrait(name) {
  ["hero","tadokoro","mur"].forEach(id => $(id).classList.toggle("active", id === name));
}
function setScene(chapter, portrait, speaker, dialogue, buttons) {
  $("chapter").textContent = chapter;
  showPortrait(portrait);
  $("speaker").textContent = speaker;
  $("dialogue").textContent = dialogue;
  $("choices").replaceChildren();
  buttons.forEach(item => {
    const btn = document.createElement("button");
    btn.textContent = item.text;
    if (item.className) btn.className = item.className;
    btn.onclick = item.action;
    $("choices").appendChild(btn);
  });
}
function showInvitation() {
  setScene("第1話・屋上への誘い", "tadokoro", "田所先輩（B）",
    "まずうちさぁ、屋上あんだけどぉ、焼いてかない？",
    [
      {text:"する", className:"primary", action:accept},
      {text:"しない", className:"danger", action:decline}
    ]);
}
function accept() {
  setScene("第2話・つづく", "hero", "ナレーション",
    "Aは「する」と答えた。\n田所先輩と一緒に、屋上へ向かうことに……。\n\n——ここから先は、次のアップデートで追加予定！",
    [{text:"最初から", action:restart}]);
}
function decline() {
  setScene("ゲームオーバー", "tadokoro", "田所先輩（B）",
    "ファッ？！お前やりませんねぇスギィ！MURはん、こいつやっちゃいましょうよ！",
    [{text:"……", className:"danger", action:murAppears}]);
}
function murAppears() {
  setScene("ゲームオーバー", "mur", "MUR",
    "おっそうだな",
    [{text:"ゲームオーバー", className:"danger", action:gameOver}]);
}
function gameOver() {
  setScene("GAME OVER", "mur", "システム",
    "選択肢「しない」を選んだため、ゲームオーバーになりました。",
    [{text:"タイトルからやり直す", className:"primary", action:restart}]);
}
function restart() {
  setScene("プロローグ", "hero", "ナレーション",
    "今日は田所先輩の家に遊びに来た。\n先輩に案内されていると、屋上へ続く階段が目に入った。",
    [{text:"先輩についていく", className:"primary", action:showInvitation}]);
}
</script>
